


  
name: Auto Build CI/CD

on:
  push:
    branches: [ main, pumo, mohan, abdul,vidhya]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run tests
      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: mohan6891/django-ci-cd:latest

  debug:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Show environment variables
        run: |
          echo "DEPLOY_HOST=[$DEPLOY_HOST]"
          echo "DEPLOY_USER=[$DEPLOY_USER]"
          echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > id_rsa  
          mv id_rsa deploy_key  
          chmod 600 deploy_key
          eval "$(ssh-agent -s)"
          ssh-add deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "echo Connected successfully!"

      - name: Deploy Docker container
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST "
            docker pull mohan6891/django-ci-cd:latest &&
            docker stop django-ci-cd || true &&
            docker rm django-ci-cd || true &&
            docker run -d --restart=always --name django-ci-cd -p 80:80 mohan6891/django-ci-cd:latest
          "